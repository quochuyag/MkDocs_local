site_name: Thư viện khóa học DBA
site_description: Quản lý tập trung tài liệu học Oracle DBA, MySQL, MongoDB
site_author: quochuyag
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: vi
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang nền tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang nền sáng
  icon:
    repo: fontawesome/brands/git-alt

plugins:
  - search:
      lang:
        - vi
        - en
      separator: '[\s\-\.\_]+'
  - awesome-pages:
      collapse_single_pages: false
      strict: false
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys

extra:
  generator: false

# Link hong chi canh bao, khong lam hong build (tai lieu goc co nhieu link noi bo)
validation:
  omitted_files: info
  absolute_links: ignore
  unrecognized_links: ignore
  anchors: ignore
