# Application launcher aliases for OpenClaw quan-gia.
#
# Each entry is `<alias>: { description, command, args?, cwd?, shell? }`.
# Alias name must be lowercase, [a-z0-9-]. Edit this file freely; MCP server
# re-reads on every tool call so changes take effect without restarting
# openclaw.
#
# - command: executable name on PATH, or absolute path. Forward slashes work
#   on Windows.
# - args: optional array of arguments to append.
# - cwd: optional working directory (env vars expand on Windows when shell:true).
# - shell: default true on Windows so .cmd / .bat shims and env-var expansion
#   work. Set false only if you really need an exec-only spawn.

code:
  description: Visual Studio Code (open editor; pass folder path as arg to open it)
  command: code
  shell: true

terminal:
  description: Windows Terminal (new window)
  command: wt
  shell: true

explorer:
  description: File Explorer at user home (pass a path arg to open elsewhere)
  command: explorer
  args:
    - "%USERPROFILE%"
  shell: true

notepad:
  description: Notepad (universal fallback editor)
  command: notepad
  shell: true

# Examples Anh Huy can uncomment / adapt.
