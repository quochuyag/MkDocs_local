# Khai bao cac khoa hoc cho MkDocs_local
# Moi thu muc goc trong D:\Dba_project = 1 khoa hoc
# Thay doi thu tu / ten khoa tai day roi chay: python scripts/sync.py

source_root: "D:/Dba_project"

# Chi lay bai hoc CO NOI DUNG TIENG VIET.
# Dat enabled: false de lay lai toan bo bai hoc (ca tieng Anh).
#   min_chars: so ky tu tieng Viet toi thieu trong bai
#   min_ratio: ty le ky tu tieng Viet tren tong so chu cai
# (code block va inline code duoc bo qua khi dem)
vietnamese_only:
  enabled: true
  min_chars: 30
  min_ratio: 0.01

# Thu muc / file bi loai tru o MOI khoa
exclude_dirs:
  - .git
  - .venv
  - .venv-openwebui
  - node_modules
  - site-packages
  - __pycache__
  - .pytest_cache
  - .claude
  - .gemini
  - .vscode
  - .devcontainer
  - .github
  - LOGS
  - logs

courses:
  - id: "01-oracle-dba-zero-to-hero"
    title: "01. Oracle DBA — Zero to Hero"
    path: "Oracle-Database-Administration-from-Zero-to-Hero"
    desc: "Khoa nen tang quan tri Oracle Database tu co ban den nang cao."

  - id: "02-rman-backup-recovery"
    title: "02. Backup & Recovery voi RMAN"
    path: "Oracle-Database-Backup-and-Recovery-using-RMAN"
    desc: "Sao luu, phuc hoi va Data Guard bang Oracle RMAN."
    # 16 file modules/module_NN_guide.md trung byte-for-byte voi ban trong
    # modules/module_NN/ -> chi giu ban trong thu muc con
    drop_duplicates: true

  - id: "03-performance-tuning"
    title: "03. Performance Tuning"
    path: "The-Oracle-Database-Performance-Tuning-Course"
    desc: "Toi uu hieu nang Oracle Database: AWR, ASH, SQL tuning."

  - id: "04-rac-administration"
    title: "04. RAC Administration"
    path: "The-Oracle-Database-RAC-Administration-Course"
    desc: "Quan tri Oracle Real Application Clusters."

  - id: "05-multitenant"
    title: "05. Multitenant Administration"
    path: "The-Oracle-Database-Multitenant-Administration-Course"
    desc: "Kien truc CDB/PDB va quan tri multitenant."

  - id: "06-high-availability"
    title: "06. High Availability (MySQL & MongoDB)"
    path: "HA"
    desc: "Replica set, sharding, cluster va runbook van hanh."

  - id: "07-sach-va-tai-lieu"
    title: "07. Sach & Tai lieu (PDF da chuyen doi)"
    path: "pdf_md"
    desc: "Sach ky thuat da convert sang Markdown."

  - id: "08-vagrant-projects"
    title: "08. Vagrant Projects (Oracle)"
    path: "vagrant-projects"
    desc: "Bo lab Vagrant chinh chu cua Oracle."

  - id: "09-dba-ai"
    title: "09. DBA + AI Automation"
    path: "dba_ai"
    desc: "Tu dong hoa cong viec DBA bang AI agent."

  - id: "10-dbatools-lab"
    title: "10. DBATools Lab"
    path: "dbatools-lab"
    desc: "Lab cong cu DBA."

  - id: "11-book-lab"
    title: "11. Book Lab"
    path: "book_lab"
    desc: "Ban lab day du kem theo sach."

  - id: "12-sql-oracle-mysql"
    title: "12. SQL Oracle & MySQL"
    path: "sql_oracle_mysqll"
    desc: "Tong hop cau lenh SQL Oracle va MySQL."

  - id: "13-vietpay"
    title: "13. VietPay"
